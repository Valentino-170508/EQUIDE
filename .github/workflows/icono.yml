
name: Cambiar icono de agenda.exe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cambiar-icono:
    runs-on: windows-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Cambiar icono del ejecutable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "agenda.exe"
          $ico = Join-Path $PWD "transfer.ico"

          if (!(Test-Path $exe)) { throw "No se encuentra agenda.exe" }
          if (!(Test-Path $ico)) { throw "No se encuentra transfer.ico" }

          $tool = Join-Path $env:RUNNER_TEMP "ResourceHacker.exe"
          $url = "https://www.angusj.com/resourcehacker/resource_hacker.zip"
          $zip = Join-Path $env:RUNNER_TEMP "resource_hacker.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "rh") -Force

          $rh = Get-ChildItem (Join-Path $env:RUNNER_TEMP "rh") -Recurse -Filter "ResourceHacker.exe" |
            Select-Object -First 1

          if (!$rh) { throw "No se encontró Resource Hacker en el paquete descargado" }

          $output = Join-Path $PWD "agenda_modificado.exe"
          $script = Join-Path $env:RUNNER_TEMP "replace.rc"

          @"
          -open "$exe"
          -save "$output"
          -action addoverwrite
          -res "$ico"
          -mask ICONGROUP,MAINICON,
          "@ | Set-Content -Path $script -Encoding ASCII

          & $rh.FullName -script $script

          if (!(Test-Path $output)) { throw "No se generó el ejecutable modificado" }

      - name: Guardar ejecutable modificado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: agenda-con-nuevo-icono
          path: agenda_modificado.exe
