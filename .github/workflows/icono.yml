
name: Cambiar icono de agenda.exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cambiar-icono:
    runs-on: windows-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Cambiar icono del EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $PWD "agenda.exe"
          $ico = Join-Path $PWD "transfer.ico"
          $output = Join-Path $PWD "agenda_modificado.exe"

          if (!(Test-Path $exe)) {
            throw "No se encuentra agenda.exe"
          }

          if (!(Test-Path $ico)) {
            throw "No se encuentra transfer.ico"
          }

          Copy-Item $exe $output

          $tool = Join-Path $env:RUNNER_TEMP "rcedit.exe"
          $url = "https://github.com/electron/rcedit/releases/latest/download/rcedit-x64.exe"

          Invoke-WebRequest -Uri $url -OutFile $tool

          & $tool $output --set-icon $ico

          if ($LASTEXITCODE -ne 0) {
            throw "rcedit no pudo modificar el icono. Código: $LASTEXITCODE"
          }

          if (!(Test-Path $output)) {
            throw "No se generó el ejecutable modificado"
          }

          Write-Host "Icono actualizado correctamente"

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: agenda-con-nuevo-icono
          path: agenda_modificado.exe
